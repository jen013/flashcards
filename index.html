<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./styles/main.css" rel="stylesheet">
    <link href="./styles/index.css" rel="stylesheet">
    <script src="./scripts/index.js" type="module"></script>

    <title>Flashcards</title>
</head>

<body>
    <header>
        <h1><a href="./" title="Home">Flashcards</a></h1>

        <dialog id="import-popup-dialog">
            <form id="import-popup-form">
                <p>Paste the text version of the flashcard set you want to import.</p>
                <div>
                    <input type="text" name="import-text" class="import-text">
                    <small class="import-fail-message" hidden>Import failed. Please check that the text was pasted properly and copied directly from a flashcard set.</small>
                </div>
                <div class="import-popup-buttons">
                    <input type="button" name="import-cancel" class="import-cancel" value="Cancel">
                    <input type="submit" name="import-confirm" class="import-confirm" value="Import">
                </div>
            </form>
        </dialog>

        <div class="create-set-buttons">
            <input type="button" id="import-text-button" value="⎘" title="Import From Text">
            <input type="button" id="new-set-button" value="+" title="Create Flashcard Set">
        </div>
    </header>
    
    <main>
        <p class="intro-message" hidden>Get Started by Clicking the "+" Button in the Bottom Right Corner.</p>

        <ul id="flashcard-sets"></ul>
    </main>

    <template id="card-set-template">
        <li class="card-set">
            <a class="title" title="View Set"></a>
            <p class="cards-length"></p>
            <small class="cards-summary"></small>
            <input type="button" class="play-button" value="▶" title="Play">
            <input type="button" class="edit-button" value="✎" title="Edit">
        </li>
    </template>
    
    <template id="card-template">
        <li class="card">
            <section class="front">
                <p class="text"></p>
                <img hidden>
                <audio hidden><source></audio>
            </section>
            <section class="back">
                <p class="text"></p>
                <img hidden>
                <audio hidden><source></audio>
            </section>
        </li>
    </template>
</body>

</html>
