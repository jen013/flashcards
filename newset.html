<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device-width, initial-scale=1">
    <link href="./src/css/main.css" rel="stylesheet">
    <link href="./src/css/viewset.css" rel="stylesheet">
    <script src="./src/js/newset.js" type="module"></script>

    <title>Create Flashcard Set</title>
</head>

<body>
    <header>
        <h1><a href="./" title="Home">Flashcards</a></h1>
    </header>

    <main>
        <form id="card-set-form">
            <input type="text" name="title" class="title" placeholder="Enter Title Here">

            <fieldset class="card-set">
                <input type="button" name="add-card-button" value="+" title="Insert Card">
            </fieldset>
            
            <div class="card-set-confirmation">
                <input type="button" class="cancel-button" value="Cancel" onclick="window.location.href = './'">
                <input type="submit" class="save-button" value="Save">
            </div>
        </form>
    </main>
    
    
    <template id="card-template">
        <fieldset name="card" class="card">
            <div class="card-data">
                <fieldset name="front" class="card-side">
                    <p name="text" contenteditable="true"></p>
                    <input type="file" name="image" accept="image/*,.pdf" hidden>
                    <input type="file" name="audio" accept="audio/*" hidden>
                </fieldset>
                
                <fieldset name="back" class="card-side">
                    <p name="text" contenteditable="true"></p>
                    <input type="file" name="image" accept="image/*,.pdf" hidden>
                    <input type="file" name="audio" accept="audio/*" hidden>
                </fieldset>
            </div>
            
            <input type="button" name="delete-card-button" value="-" title="Delete Card">
        </fieldset>
    </template>
</body>

</html>
